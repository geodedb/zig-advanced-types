# Diagnostic branch only. Never merge this reduced pipeline.
workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
  - if: $CI_COMMIT_BRANCH == "ci/advanced-types-benchmark-probe-turn114"
  - when: never
variables:
  ZIG_VERSION: 0.16.0
  GIT_DEPTH: '3'
compare-benchmark-revisions:
  stage: test
  interruptible: true
  image: debian:bookworm-slim
  tags:
  - company
  - linux
  - dedicated
  - docker
  - x86
  - local-nvme
  timeout: 15m
  before_script:
  - apt-get update && apt-get install -y curl xz-utils python3 git
  - "if [ ! -f \"zig-${ZIG_VERSION}/zig\" ]; then\n  ARCH=$(uname -m)\n  case \"$ARCH\" in\n    x86_64)  ZIG_ARCH=\"x86_64\"\
    \ ;;\n    aarch64) ZIG_ARCH=\"aarch64\" ;;\n    arm64)   ZIG_ARCH=\"aarch64\" ;;\n    *)       echo \"Unsupported architecture:\
    \ $ARCH\"; exit 1 ;;\n  esac\n  MAJOR=$(echo \"$ZIG_VERSION\" | cut -d. -f1)\n  MINOR=$(echo \"$ZIG_VERSION\" | cut -d.\
    \ -f2)\n  if [ \"$MAJOR\" -eq 0 ] && [ \"$MINOR\" -lt 15 ]; then\n    ARCHIVE_NAME=\"zig-linux-${ZIG_ARCH}-${ZIG_VERSION}\"\
    \n  else\n    ARCHIVE_NAME=\"zig-${ZIG_ARCH}-linux-${ZIG_VERSION}\"\n  fi\n  TARBALL=\"${ARCHIVE_NAME}.tar.xz\"\n  INDEX_FILE=$(mktemp)\n\
    \  curl -fsSL \"https://ziglang.org/download/index.json\" -o \"${INDEX_FILE}\"\n  EXPECTED_HASH=$(ZIG_VER=\"${ZIG_VERSION}\"\
    \ ZIG_ARCH_KEY=\"${ZIG_ARCH}-linux\" ZIG_IDX=\"${INDEX_FILE}\" \\\n    python3 -c \"\nimport json, os, sys\nidx = json.load(open(os.environ['ZIG_IDX']))\n\
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})\nh = pkg.get('shasum', '')\nif not h: sys.exit('SHA-256\
    \ not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])\nprint(h)\n\")\n  rm -f \"${INDEX_FILE}\"\
    \n  curl -fsSL \"https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}\" -o \"${TARBALL}\"\n  echo \"${EXPECTED_HASH}\
    \  ${TARBALL}\" | sha256sum --check --strict\n  # ATX-02: also verify against the committed lock so a compromised\n  #\
    \ ziglang.org index cannot silently swap the toolchain.\n  grep \" ${TARBALL}$\" ci/zig-sha256.lock | sha256sum -c - ||\
    \ { echo \"Zig tarball failed committed-hash verification (ci/zig-sha256.lock)\"; exit 1; }\n  tar -xJf \"${TARBALL}\"\
    \n  mv \"${ARCHIVE_NAME}\" \"zig-${ZIG_VERSION}\"\n  rm -f \"${TARBALL}\"\nfi\n"
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version
  script:
  - python3 ci/compare-benchmark-revisions.py
  artifacts:
    when: always
    paths:
    - reports/
    expire_in: 3 days
