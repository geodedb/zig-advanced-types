---
# GitLab CI/CD Pipeline for advanced-types
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    # CI-SCHED-01: 'company' alone also matches the Hosted Windows Runners,
    # which executed these bash scripts under PowerShell and failed the
    # 2026-05-02 main/v0.1.2 pipelines. Pin default (bash/docker) jobs to
    # Linux runners; the cross-platform jobs override tags explicitly.
    - company
    - linux

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.55.8
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.55.8
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.55.8
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.55.8

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.55.8

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.55.8
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.55.8

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.55.8
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.55.8

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - fuzz
  - coverage
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      # ATX-02: also verify against the committed lock so a compromised
      # ziglang.org index cannot silently swap the toolchain.
      grep " ${TARBALL}$" ci/zig-sha256.lock | sha256sum -c - || { echo "Zig tarball failed committed-hash verification (ci/zig-sha256.lock)"; exit 1; }
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version
# input; it also pins ZIG_VERSION at JOB level, which beats the global
# pipeline variable -- so the override must re-pin it here (CI-FMT-01;
# first exposed when CI-SCHED-01 let this job actually run on Linux:
# the ATX-02 lock check correctly failed closed on the unpinned 0.14.0).
zig-format:
  variables:
    ZIG_VERSION: "0.16.0"
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Type-extension tests (cross-feature coverage)
test-extensions:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-extensions --summary all
  needs:
    - build

# Performance / bulk-workflow tests (correctness, not benchmarks)
test-performance:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-performance --summary all
  needs:
    - build

# Parser edge-case regression tests (Q33)
test-parser-edges:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-parser-edges --summary all
  needs:
    - build

# BENCH-02 (#58): bench regression gate.
#
# Runs `zig build bench -Doptimize=ReleaseFast` and compares the reported
# min-of-N ns/op against bench/baseline.json. Fails the job when any
# benchmark exceeds baseline * 1.30 (30% slower). The 30% tolerance is
# calibrated against the 11-17% intra-run jitter BENCH-01 measured on the
# shared developer workstation -- a tighter gate would flap. See
# ci/bench_gate.py's module docstring and
# docs/audit/gap-close-implement-log.md (CP-3) for the derivation.
bench:
  stage: test
  image: debian:bookworm-slim
  # CI-BENCH-01: the company runner pool is performance-heterogeneous
  # (OVH dedicated vs Lab Servers differ ~2.5x), so a static baseline can
  # only gate one class. Pin bench to the dedicated x86 (OVH) class --
  # bench/baseline.json envelope values cover that class incl. loaded runs.
  # SONNY-4830: dedicated also matches AWS Spot overflow. The docker/x86
  # intersection selects the calibrated OVH pool and excludes that overflow.
  tags:
    - company
    - linux
    - dedicated
    - docker
    - x86
  before_script:
    - *install-zig
  script:
    - python3 ci/bench_gate.py
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# ============================================================================
# Cross-OS / cross-architecture test matrix (GAP-0019).
#
# README claims "Linux, macOS, Windows, aarch64 support" but only Linux x86_64
# is currently validated in CI. The jobs below add the missing coverage.
#
# NOTE: this project uses company-tagged runners. If macOS, Windows, or
# aarch64 runners are not yet provisioned, each job will stay pending or
# error out at dispatch; `allow_failure: true` keeps the pipeline green
# and `rules: when: manual` prevents them from auto-starting on every push.
# Unblocking path is tracked in docs/audit/gap-close-blockers.md.
# ============================================================================

test-macos:
  stage: test
  tags:
    - macos
  before_script:
    # CI-SUP-01: fetch Zig from ziglang.org with SHA-256 verification instead
    # of `brew install zig` (brew does not expose a pinned artefact hash for
    # the version we require). Mirrors the Linux .install-zig template.
    - |
      set -euo pipefail
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  ZIG_ARCH="x86_64" ;;
          arm64)   ZIG_ARCH="aarch64" ;;
          aarch64) ZIG_ARCH="aarch64" ;;
          *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
        MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
        if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
          ARCHIVE_NAME="zig-macos-${ZIG_ARCH}-${ZIG_VERSION}"
        else
          ARCHIVE_NAME="zig-${ZIG_ARCH}-macos-${ZIG_VERSION}"
        fi
        TARBALL="${ARCHIVE_NAME}.tar.xz"
        INDEX_FILE=$(mktemp)
        curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
        EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-macos" ZIG_IDX="${INDEX_FILE}" \
          python3 -c "
      import json, os, sys
      idx = json.load(open(os.environ['ZIG_IDX']))
      pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
      h = pkg.get('shasum', '')
      if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
      print(h)
      ")
        rm -f "${INDEX_FILE}"
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
        echo "${EXPECTED_HASH}  ${TARBALL}" | shasum -a 256 --check --strict
        # ATX-02: also verify against the committed lock so a compromised
        # ziglang.org index cannot silently swap the toolchain.
        grep " ${TARBALL}$" ci/zig-sha256.lock | shasum -a 256 -c - || { echo "Zig tarball failed committed-hash verification (ci/zig-sha256.lock)"; exit 1; }
        tar -xJf "${TARBALL}"
        mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
        rm -f "${TARBALL}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - zig build test --summary all
    - zig build test-integration --summary all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

test-windows:
  stage: test
  tags:
    - windows
  before_script:
    # CI-SUP-02: verify Zig Windows archive SHA-256 via ziglang.org/download/index.json
    # before extracting. Uses PowerShell Get-FileHash (shipped with Windows PS 5+).
    - |
      pwsh -Command "
        \$ErrorActionPreference = 'Stop'
        \$ver = \$env:ZIG_VERSION
        \$parts = \$ver.Split('.')
        if ([int]\$parts[0] -eq 0 -and [int]\$parts[1] -lt 15) {
          \$archiveBase = \"zig-windows-x86_64-\$ver\"
        } else {
          \$archiveBase = \"zig-x86_64-windows-\$ver\"
        }
        \$zipName = \"\$archiveBase.zip\"
        Invoke-WebRequest -Uri 'https://ziglang.org/download/index.json' -OutFile index.json
        \$idx = Get-Content index.json | ConvertFrom-Json
        \$expected = \$idx.\$ver.'x86_64-windows'.shasum
        if (-not \$expected) { throw \"SHA-256 not found for \$ver/x86_64-windows\" }
        Invoke-WebRequest -Uri \"https://ziglang.org/download/\$ver/\$zipName\" -OutFile \$zipName
        \$actual = (Get-FileHash -Algorithm SHA256 \$zipName).Hash.ToLower()
        if (\$actual -ne \$expected.ToLower()) {
          throw \"SHA-256 mismatch: expected \$expected actual \$actual\"
        }
        # ATX-02: also verify against the committed lock so a compromised
        # ziglang.org index cannot silently swap the toolchain.
        \$lockLine = Select-String -Path 'ci/zig-sha256.lock' -Pattern ('  ' + [regex]::Escape(\$zipName) + '\$') | Select-Object -First 1
        if (-not \$lockLine) { throw \"\$zipName not found in ci/zig-sha256.lock\" }
        \$lockHash = (\$lockLine.Line -split ' ')[0].ToLower()
        if (\$actual -ne \$lockHash) {
          throw \"Zig archive failed committed-hash verification (ci/zig-sha256.lock): expected \$lockHash actual \$actual\"
        }
        Expand-Archive \$zipName -DestinationPath . -Force
        Remove-Item \$zipName, index.json
        \$env:PATH = \"\$PWD\\\$archiveBase;\$env:PATH\"
        zig version
      "
  script:
    - |
      pwsh -Command "
        \$ver = \$env:ZIG_VERSION
        \$parts = \$ver.Split('.')
        if ([int]\$parts[0] -eq 0 -and [int]\$parts[1] -lt 15) {
          \$archiveBase = \"zig-windows-x86_64-\$ver\"
        } else {
          \$archiveBase = \"zig-x86_64-windows-\$ver\"
        }
        \$env:PATH = \"\$PWD\\\$archiveBase;\$env:PATH\"
        zig build test --summary all
        zig build test-integration --summary all
      "
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

test-linux-aarch64:
  stage: test
  image: debian:bookworm-slim
  tags:
    # CI-SCHED-02: the ARM lab runners advertise 'arm64' (not 'aarch64').
    - linux
    - arm64
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
    - zig build test-integration --summary all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# ============================================================================
# Coverage (GAP-0011 / Q31)
#
# Runs kcov against the main unit-test binary and publishes the HTML
# report as a pipeline artifact. Report-only -- no percentage threshold
# gates the pipeline. A follow-up issue will add the gate once a
# stable baseline has been collected.
# ============================================================================
coverage:
  stage: coverage
  # CI-COV-01 (take 2): kcov is packaged in neither Debian bookworm nor
  # Ubuntu noble (verified: universe enabled, package absent). Use the
  # official kcov image instead -- Debian-based with kcov preinstalled;
  # entrypoint cleared so GitLab can run its shell.
  image:
    name: kcov/kcov:v42
    entrypoint: [""]
  before_script:
    - *install-zig
  script:
    # Build the unit-test binary with debug info so kcov can decode frames.
    - zig build test -Doptimize=Debug --summary all
    # Locate the test binary in the zig-cache (Zig puts it under .zig-cache/o/<hash>/test).
    - TEST_BIN=$(find .zig-cache/o -name test -type f -executable | head -n1)
    - echo "Coverage target $TEST_BIN"
    - mkdir -p coverage
    - kcov --include-path=src coverage "$TEST_BIN" || true
    - ls -la coverage/
  coverage: '/Total.*\s(\d+\.\d+)%/'
  artifacts:
    name: "coverage-${CI_COMMIT_SHORT_SHA}"
    paths:
      - coverage/
    expire_in: 1 month
    expose_as: "Coverage Report"
  allow_failure: true
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# ============================================================================
# Release provenance (NEW-REL-01 #71)
#
# The `release-semantic@v1.7.1` component creates the tag and draft
# release. By itself it does not (a) GPG-sign the tag or (b) attach the
# project SBOM to the release so downstream consumers have a
# cryptographically verifiable anchor between a tag and the bytes CI
# produced.
#
# This section adds both in a minimally invasive way:
#   * `release-sign-tag`  -- after the semantic component pushes the
#     tag, verify / annotate it with the GPG key loaded from the
#     `RELEASE_GPG_PRIVATE_KEY` masked CI variable. The key fingerprint
#     is exposed via `RELEASE_GPG_FINGERPRINT`. Tag signing uses the
#     `gpg --local-user <fpr> --detach-sign` flow so the semantic
#     component's tag reference is preserved.
#     ATX-03: signing is fail-closed -- the job asserts the existing tag
#     points at $CI_COMMIT_SHA before replacing it with a signed tag at
#     the SAME commit; it never moves a tag to a different commit.
#   * `release-attach-sbom` -- pulls the `sbom-generate` job's CycloneDX
#     output from the current pipeline and uploads it as a release
#     asset via the GitLab Release API. Consumers can then fetch the
#     SBOM at `<release-url>/sbom.cdx.json` and verify it alongside the
#     source tarball.
#
# Both jobs are scoped to tag pipelines only so branch/MR runs skip
# them; `allow_failure: true` is deliberately OFF (regression in
# release provenance must fail the pipeline once the variables are
# populated).
# ============================================================================

release-sign-tag:
  stage: release
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG && $RELEASE_GPG_PRIVATE_KEY'
  before_script:
    - apt-get update && apt-get install -y gnupg git
  script:
    - set -euo pipefail
    # ATX-03: fail closed -- never sign with an unset key, never move a tag
    # to a different commit. The only permitted mutation is replacing an
    # UNSIGNED tag with a SIGNED tag pointing at the SAME commit.
    - test -n "${RELEASE_GPG_FINGERPRINT:-}" || { echo "RELEASE_GPG_FINGERPRINT is unset; refusing to sign"; exit 1; }
    - echo "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
    - gpg --list-secret-keys --keyid-format=long
    - git config --global user.signingkey "$RELEASE_GPG_FINGERPRINT"
    - git config --global tag.gpgSign true
    - git config --global user.email "ci@${CI_SERVER_HOST}"
    - git config --global user.name "release-bot"
    - |
      if git tag -v "$CI_COMMIT_TAG" >/dev/null 2>&1; then
        echo "Tag $CI_COMMIT_TAG is already signed; nothing to do."
        exit 0
      fi
    - |
      TAG_COMMIT="$(git rev-parse "refs/tags/${CI_COMMIT_TAG}^{commit}")"
      if [ "$TAG_COMMIT" != "$CI_COMMIT_SHA" ]; then
        echo "Refusing to re-tag: ${CI_COMMIT_TAG} points at ${TAG_COMMIT}, pipeline is for ${CI_COMMIT_SHA}"
        exit 1
      fi
    - git tag -s -f "$CI_COMMIT_TAG" -m "Signed release $CI_COMMIT_TAG" "$CI_COMMIT_SHA"
    - git push "https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}" --force
  needs:
    - build

release-attach-sbom:
  stage: release
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update && apt-get install -y curl jq
  script:
    - |
      set -euo pipefail
      # The sbom-generate component (v1.7.1) writes gl-sbom.cdx.json.gz
      # (gzipped, no dash) to the job workspace -- observed on the v0.1.4
      # tag pipeline. Accept both plain and gzipped forms; fail loudly if
      # neither exists -- a release without an SBOM is exactly the class
      # this gap closes.
      SBOM_FILE=$(ls gl-sbom*.cdx.json 2>/dev/null | head -n1 || true)
      if [ -z "${SBOM_FILE}" ]; then
        SBOM_GZ=$(ls gl-sbom*.cdx.json.gz 2>/dev/null | head -n1 || true)
        if [ -n "${SBOM_GZ}" ]; then
          gunzip -k "${SBOM_GZ}"
          SBOM_FILE="${SBOM_GZ%.gz}"
        fi
      fi
      if [ -z "${SBOM_FILE}" ]; then
        echo "error: no gl-sbom*.cdx.json[.gz] found in job workspace" >&2
        exit 1
      fi
      echo "Attaching ${SBOM_FILE} to release ${CI_COMMIT_TAG}"
      UPLOAD_RESP=$(curl -fsSL \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --form "file=@${SBOM_FILE}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/uploads")
      URL=$(echo "${UPLOAD_RESP}" | jq -r .url)
      curl -fsSL --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data "name=SBOM (CycloneDX)" \
        --data "url=${CI_PROJECT_URL}${URL}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
  needs:
    - job: sbom-generate
      artifacts: true
    - job: create-release
    - build

# Disable merge_request_event pipelines. Jobs without rules never run in MR
# pipelines, so the few MR-ruled jobs fail on `needs:` of jobs that are not
# there ("error on the CI/CD configuration file"), and that failed MR pipeline
# becomes the head pipeline that blocks auto-merge. Branch pipelines carry the
# real jobs; evaluate those. (Same fix as devnw/zig/uuid fc0d25fd.)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always
